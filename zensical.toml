[project.theme]
# font.text = "Roboto Mono"
# font.code = "Roboto Mono"
favicon = "logo.png"
logo = "logo.png"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.theme.icon.tag]
default = "lucide/hash"
usage = "lucide/book-open"
async = "lucide/zap"
sync = "lucide/refresh-cw"
reference = "lucide/book-marked"
models = "lucide/box"
berries = "lucide/leaf"
contests = "lucide/trophy"
currencies = "lucide/coins"
encounters = "lucide/footprints"
evolution = "lucide/dna"
games = "lucide/gamepad-2"
items = "lucide/backpack"
locations = "lucide/map"
machines = "lucide/disc-3"
moves = "lucide/swords"
pokemon = "lucide/paw-print"
utility = "lucide/wrench"

# Palette toggle for automatic mode
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"
primary = "purple"
accent = "purple"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "purple"
accent = "purple"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"
primary = "purple"
accent = "purple"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/pypokeclient/"
name = "PyPI page"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/RistoAle97"
name = "Author's GitHub profile"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://linkedin.com/in/ristoale97"
name = "Author's LinkedIn profile"

[project.extra.tags]
Usage = "usage"
Asynchronous = "async"
Synchronous = "sync"
Reference = "reference"
Models = "models"
Berries = "berries"
Contests = "contests"
Currencies = "currencies"
Encounters = "encounters"
Evolution = "evolution"
Games = "games"
Items = "items"
Locations = "locations"
Machines = "machines"
Moves = "moves"
Pokemon = "pokemon"
Utility = "utility"

[project.plugins.tags]

[project.plugins.mkdocstrings.handlers.python]
# inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
# annotations_path = "source"
docstring_options = { "ignore_init_summary" = true }
docstring_style = "google"
extensions = ["griffe_typingdoc", "griffe_inherited_docstrings"]
line_length = 120
members = false
members_order = "source"
merge_init_into_class = true
inherited_members = true
show_docstring_attributes = true
show_if_no_docstring = true
show_labels = false
show_source = false
show_root_full_path = false
show_root_heading = true
show_symbol_type_heading = true
show_symbol_type_toc = true

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
smart_enable = "all"

[project.markdown_extensions.pymdownx.caret]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"

[project.markdown_extensions.pymdownx.highlight]

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.mark]

[project.markdown_extensions.pymdownx.smartsymbols]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.tilde]
